<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GREEN LIVING AT SCHOOL — Small Actions, Big Changes (3D Presentation)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- WebGL Background Layer (Nebula Fog + Interactive Particle System + 3D Outro Leaf) -->
    <div id="webgl-container"></div>

    <!-- CSS3D / 3D Perspective Layer for Slide Typography & 3D Image Showcases -->
    <div id="css3d-container"></div>

    <!-- 3D Assistant Character Layer (Nahida 2K Rigged GLB + Real-Time Soft Shadows) -->
    <div id="assistant-webgl-container"></div>

    <!-- 3D Ecological Projection Curtain (Interstitial Q&A Roll-Down Screen for Slides 2 -> 10) -->
    <div id="interstitial-curtain-overlay" class="interstitial-curtain-overlay" aria-hidden="true">
      <div class="curtain-top-roller"></div>
      <div class="curtain-grid-pattern"></div>
      <div class="curtain-ambient-glow"></div>

      <!-- Update V37: Nahida Botanical Dendro Sanctuary Decoration (Left Border + Top-Right Arch & Bottom-Right Low Foliage) -->
      <div id="nahida-botanical-sanctuary" class="nahida-botanical-sanctuary" aria-hidden="true"></div>

      <div class="curtain-qa-stage">
        <div id="curtain-slide-badge" class="curtain-slide-badge">
          INTERACTIVE Q&amp;A // BEFORE SLIDE 02
        </div>
        <div id="curtain-comment-line" class="curtain-comment-line"></div>
        <div id="curtain-question-line" class="curtain-question-line"></div>
        <div class="curtain-hint-pill">
          <span class="curtain-hint-dot"></span>
          <span id="curtain-hint-text">Click right side to reveal Slide 02 -&gt;</span>
        </div>
      </div>

      <!-- Bottom emerald light border & pull bar -->
      <div class="curtain-bottom-pullbar">
        <div class="curtain-pull-handle-ring"></div>
      </div>
    </div>

    <!-- Volumetric Fog Surge Overlay (Used during Slide 3->4 Forward Dive & Slide 7->8 Pull-Back) -->
    <div id="fog-transition-overlay" class="fog-transition-overlay"></div>

    <!-- Ambient Vignette & Subtle Scanline Overlay -->
    <div class="ambient-overlay"></div>

    <!-- Split-Screen Invisible Interactive Zones -->
    <div id="nav-left" class="nav-zone nav-zone-left" title="Click to go to Previous Slide">
      <div class="nav-indicator nav-indicator-left">&lt;</div>
    </div>
    <div id="nav-right" class="nav-zone nav-zone-right" title="Click to go to Next Slide">
      <div class="nav-indicator nav-indicator-right">&gt;</div>
    </div>

    <!-- Top Progress & Slide Counter Bar -->
    <div class="top-progress-track">
      <div id="top-progress-bar" class="top-progress-bar"></div>
    </div>

    <!-- Bottom-Right Glowing Badge -->
    <div class="project-badge">
      <span class="badge-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </span>
      <span class="badge-text">English 10 – Global Success | Group: Group 1 | Class: 10A3</span>
    </div>

    <!-- Minimal Slide Dots Indicator (Bottom Left) -->
    <div id="slide-dots" class="slide-dots"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
